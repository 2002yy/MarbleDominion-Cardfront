name: B1 Simulation Tests

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: b1-simulation-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  b1-simulation:
    runs-on: windows-latest
    env:
      GODOT_VERSION: 4.6.2-stable
      GODOT_ARCHIVE: Godot_v4.6.2-stable_win64.exe.zip
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot archive
        uses: actions/cache@v4
        with:
          path: .godot-cache
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_ARCHIVE }}
      - name: Download Godot
        id: godot
        shell: pwsh
        run: |
          $cacheDir = Join-Path "${{ github.workspace }}" ".godot-cache"
          New-Item -ItemType Directory -Path $cacheDir -Force | Out-Null
          $archiveUrl = "https://github.com/godotengine/godot/releases/download/$env:GODOT_VERSION/$env:GODOT_ARCHIVE"
          $archivePath = Join-Path $cacheDir $env:GODOT_ARCHIVE
          $extractPath = Join-Path $env:RUNNER_TEMP "godot"
          if (-not (Test-Path $archivePath)) { Invoke-WebRequest -Uri $archiveUrl -OutFile $archivePath }
          Expand-Archive -Path $archivePath -DestinationPath $extractPath -Force
          $godotExe = Get-ChildItem -Path $extractPath -Recurse -Filter "*console.exe" | Select-Object -First 1
          if (-not $godotExe) { $godotExe = Get-ChildItem -Path $extractPath -Recurse -Filter "*.exe" | Select-Object -First 1 }
          if (-not $godotExe) { throw "Godot executable not found." }
          "path=$($godotExe.FullName)" >> $env:GITHUB_OUTPUT
      - name: Parse and import
        shell: pwsh
        run: |
          & "${{ steps.godot.outputs.path }}" --headless --audio-driver Dummy --path "${{ github.workspace }}" --quit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "${{ steps.godot.outputs.path }}" --headless --editor --audio-driver Dummy --path "${{ github.workspace }}" --quit
          exit $LASTEXITCODE
      - name: Run B1 simulation tests
        shell: pwsh
        run: |
          & "${{ steps.godot.outputs.path }}" --headless --audio-driver Dummy --path "${{ github.workspace }}" --script "res://scripts/tests/CardfrontB1SimulationTestRunner.gd"
          exit $LASTEXITCODE
