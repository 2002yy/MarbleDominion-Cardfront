name: B1 Simulation Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

concurrency:
  group: b1-simulation-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # BEGIN ONE SHOT PROJECTILE PATCH
  apply-projectile-patch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Execute stored projectile patch
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --branch agent/simulation-parity-b1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          python3 - <<'PY'
          from pathlib import Path
          import re

          stored_path = Path('.github/workflows/apply-projectile-types.yml')
          workflow = stored_path.read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          lines = workflow[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          script = script.replace("\\t          raise RuntimeError('bullet visual marker missing')", "              raise RuntimeError('bullet visual marker missing')")
          compile(script, 'stored-projectile-patch', 'exec')
          exec(script, {'__name__': '__main__'})
          Path('.github/workflows/run-projectile-patch.yml').unlink(missing_ok=True)

          b1_path = Path('.github/workflows/b1-simulation-tests.yml')
          b1_text = b1_path.read_text(encoding='utf-8')
          b1_text = re.sub(r'(?ms)^  # BEGIN ONE SHOT PROJECTILE PATCH\n.*?^  # END ONE SHOT PROJECTILE PATCH\n', '', b1_text, count=1)
          b1_text = b1_text.replace('permissions:\n  contents: write\n\n', '')
          b1_path.write_text(b1_text, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "combat: implement visible projectile roles"
          git push -q origin HEAD:agent/simulation-parity-b1
  # END ONE SHOT PROJECTILE PATCH

  b1-simulation:
    name: ${{ matrix.batch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - batch: B1 route gate defense unit
            script: CardfrontB1SimulationTestRunner.gd
            seeds: 1
          - batch: B1 162-match matrix probe
            script: CardfrontB1BalanceAuditTestRunner.gd
            seeds: 3
          - batch: B1 5400 directional audit
            script: CardfrontB1BalanceAuditTestRunner.gd
            seeds: 100
          - batch: B1 16200 gunner health confirmation
            script: CardfrontB1HeroFinalistAuditTestRunner.gd
            seeds: 100
    env:
      GODOT_VERSION: 4.6.2-stable
      GODOT_ARCHIVE: Godot_v4.6.2-stable_win64.exe.zip
      CARDFRONT_B1_AUDIT_SEEDS: ${{ matrix.seeds }}
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot archive
        uses: actions/cache@v4
        with:
          path: .godot-cache
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_ARCHIVE }}
      - name: Download Godot
        id: godot
        shell: pwsh
        run: |
          $cacheDir = Join-Path "${{ github.workspace }}" ".godot-cache"
          New-Item -ItemType Directory -Path $cacheDir -Force | Out-Null
          $archiveUrl = "https://github.com/godotengine/godot/releases/download/$env:GODOT_VERSION/$env:GODOT_ARCHIVE"
          $archivePath = Join-Path $cacheDir $env:GODOT_ARCHIVE
          $extractPath = Join-Path $env:RUNNER_TEMP "godot"
          if (-not (Test-Path $archivePath)) { Invoke-WebRequest -Uri $archiveUrl -OutFile $archivePath }
          Expand-Archive -Path $archivePath -DestinationPath $extractPath -Force
          $godotExe = Get-ChildItem -Path $extractPath -Recurse -Filter "*console.exe" | Select-Object -First 1
          if (-not $godotExe) { $godotExe = Get-ChildItem -Path $extractPath -Recurse -Filter "*.exe" | Select-Object -First 1 }
          if (-not $godotExe) { throw "Godot executable not found." }
          "path=$($godotExe.FullName)" >> $env:GITHUB_OUTPUT
      - name: Parse and import
        shell: pwsh
        run: |
          & "${{ steps.godot.outputs.path }}" --headless --audio-driver Dummy --path "${{ github.workspace }}" --quit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "${{ steps.godot.outputs.path }}" --headless --editor --audio-driver Dummy --path "${{ github.workspace }}" --quit
          exit $LASTEXITCODE
      - name: Run ${{ matrix.batch }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "${{ github.workspace }}/artifacts/test-logs" -Force | Out-Null
          $logPath = "${{ github.workspace }}/artifacts/test-logs/${{ matrix.script }}-${{ matrix.seeds }}.log"
          & "${{ steps.godot.outputs.path }}" --headless --audio-driver Dummy --path "${{ github.workspace }}" --script "res://scripts/tests/${{ matrix.script }}" *>&1 | Tee-Object -FilePath $logPath
          $exitCode = $LASTEXITCODE
          Get-Content -Path $logPath -Tail 300
          exit $exitCode
      - name: Upload B1 test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b1-log-${{ matrix.script }}-${{ matrix.seeds }}-${{ github.run_id }}
          path: artifacts/test-logs/${{ matrix.script }}-${{ matrix.seeds }}.log
          if-no-files-found: error
      - name: Upload B1 balance artifact
        if: always() && matrix.script == 'CardfrontB1BalanceAuditTestRunner.gd'
        uses: actions/upload-artifact@v4
        with:
          name: cardfront-b1-audit-${{ matrix.seeds }}-${{ github.run_id }}
          path: artifacts/cardfront-b1-balance-audit.*
          if-no-files-found: error
      - name: Upload B1 finalist artifact
        if: always() && matrix.script == 'CardfrontB1HeroFinalistAuditTestRunner.gd'
        uses: actions/upload-artifact@v4
        with:
          name: cardfront-b1-hero-finalists-${{ matrix.seeds }}-${{ github.run_id }}
          path: artifacts/cardfront-b1-hero-finalists.*
          if-no-files-found: error
