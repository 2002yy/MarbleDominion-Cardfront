name: B1 Simulation Tests

on:
  push:
    branches:
      - main
    paths:
      - scripts/**
      - assets/**
      - project.godot
      - .github/workflows/b1-simulation-tests.yml
  pull_request:
    paths:
      - scripts/**
      - assets/**
      - project.godot
      - .github/workflows/b1-simulation-tests.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b1-simulation-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.1-stable
  GODOT_ARCHIVE: Godot_v4.7.1-stable_win64.exe.zip

jobs:
  b1-simulation:
    name: ${{ matrix.batch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: core-runtime
            batch: B1 core runtime contracts
            cases: |
              CardfrontB1SimulationTestRunner.gd|1|1|1
              CardfrontB1ModelConsistencyTestRunner.gd|1|1|1
              CardfrontProjectileTypeCombatTestRunner.gd|1|1|1
              CardfrontBattlefieldEntityFoundationTestRunner.gd|1|1|1
              CardfrontBattlefieldEntityRuntimeTestRunner.gd|1|1|1
              CardfrontUpgradeDeckTestRunner.gd|1|1|1
          - id: hero-audits
            batch: B1 hero candidate and finalist audits
            cases: |
              CardfrontB1HeroCandidateAuditTestRunner.gd|1|1|1
              CardfrontB1HeroFinalistAuditTestRunner.gd|1|1|1
          - id: deck-candidates
            batch: B1 selectable deck candidates
            cases: |
              CardfrontB1DeckCandidateAuditTestRunner.gd|1|tier|1
          - id: balance-opening
            batch: B1 balance and opening audits
            cases: |
              CardfrontB1BalanceAuditTestRunner.gd|3|1|1
              CardfrontB1OpeningBalanceAuditTestRunner.gd|1|1|tier
    env:
      B1_DECK_TIER_SEEDS: ${{ github.event_name == 'pull_request' && '5' || github.event_name == 'workflow_dispatch' && '50' || '20' }}
      B1_OPENING_TIER_SEEDS: ${{ github.event_name == 'pull_request' && '5' || github.event_name == 'workflow_dispatch' && '50' || '20' }}
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot archive
        uses: actions/cache@v4
        with:
          path: .godot-cache
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_ARCHIVE }}
      - name: Download Godot
        id: godot
        shell: pwsh
        run: |
          $cacheDir = Join-Path "${{ github.workspace }}" ".godot-cache"
          New-Item -ItemType Directory -Path $cacheDir -Force | Out-Null
          $archiveUrl = "https://github.com/godotengine/godot/releases/download/$env:GODOT_VERSION/$env:GODOT_ARCHIVE"
          $archivePath = Join-Path $cacheDir $env:GODOT_ARCHIVE
          $extractPath = Join-Path $env:RUNNER_TEMP "godot"
          if (-not (Test-Path $archivePath)) { Invoke-WebRequest -Uri $archiveUrl -OutFile $archivePath }
          Expand-Archive -Path $archivePath -DestinationPath $extractPath -Force
          $godotExe = Get-ChildItem -Path $extractPath -Recurse -Filter "*console.exe" | Select-Object -First 1
          if (-not $godotExe) { $godotExe = Get-ChildItem -Path $extractPath -Recurse -Filter "*.exe" | Select-Object -First 1 }
          if (-not $godotExe) { throw "Godot executable not found." }
          "path=$($godotExe.FullName)" >> $env:GITHUB_OUTPUT
      - name: Import Project
        shell: pwsh
        run: |
          & "${{ steps.godot.outputs.path }}" --headless --editor --audio-driver Dummy --path "${{ github.workspace }}" --quit
          exit $LASTEXITCODE
      - name: Run ${{ matrix.batch }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "${{ github.workspace }}/artifacts/test-logs" -Force | Out-Null
          $failures = @()
          $cases = @"
          ${{ matrix.cases }}
          "@ -split "`n" | ForEach-Object { $_.Trim() } | Where-Object { $_ }

          foreach ($case in $cases) {
            $parts = $case -split '\|'
            if ($parts.Count -ne 4) { throw "Invalid B1 case: $case" }

            $script = $parts[0]
            $seeds = [int]$parts[1]
            $deckSeeds = if ($parts[2] -eq 'tier') { [int]$env:B1_DECK_TIER_SEEDS } else { [int]$parts[2] }
            $openingSeeds = if ($parts[3] -eq 'tier') { [int]$env:B1_OPENING_TIER_SEEDS } else { [int]$parts[3] }

            $env:CARDFRONT_B1_AUDIT_SEEDS = "$seeds"
            $env:CARDFRONT_B1_DECK_AUDIT_SEEDS = "$deckSeeds"
            $env:CARDFRONT_B1_OPENING_AUDIT_SEEDS = "$openingSeeds"

            $logPath = "${{ github.workspace }}/artifacts/test-logs/$script-$seeds-$deckSeeds-$openingSeeds.log"
            Write-Host "Running $script seeds=$seeds deck=$deckSeeds opening=$openingSeeds"
            & "${{ steps.godot.outputs.path }}" --headless --audio-driver Dummy --path "${{ github.workspace }}" --script "res://scripts/tests/$script" *>&1 | Tee-Object -FilePath $logPath
            $exitCode = $LASTEXITCODE
            Get-Content -Path $logPath -Tail 300
            if ($exitCode -ne 0) { $failures += "$script ($exitCode)" }
          }

          if ($failures.Count -gt 0) {
            throw "B1 failures: $($failures -join ', ')"
          }
      - name: Upload B1 test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: b1-log-${{ matrix.id }}-${{ github.run_id }}
          path: artifacts/test-logs/*.log
          if-no-files-found: error
          retention-days: 7
      - name: Upload B1 balance artifact
        if: always() && matrix.id == 'balance-opening'
        uses: actions/upload-artifact@v4
        with:
          name: cardfront-b1-audit-3-${{ github.run_id }}
          path: artifacts/cardfront-b1-balance-audit.*
          if-no-files-found: error
          retention-days: 14
      - name: Upload B1 deck candidate artifact
        if: always() && matrix.id == 'deck-candidates'
        uses: actions/upload-artifact@v4
        with:
          name: cardfront-b1-deck-candidates-${{ env.B1_DECK_TIER_SEEDS }}-${{ github.run_id }}
          path: artifacts/cardfront-b1-deck-candidates.*
          if-no-files-found: error
          retention-days: 14
      - name: Upload B1 opening balance artifact
        if: always() && matrix.id == 'balance-opening'
        uses: actions/upload-artifact@v4
        with:
          name: cardfront-b1-opening-${{ env.B1_OPENING_TIER_SEEDS }}-${{ github.run_id }}
          path: artifacts/cardfront-b1-opening-balance.*
          if-no-files-found: error
          retention-days: 14

  b1-heavy-audit:
    name: B1 5400 directional audit
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    env:
      CARDFRONT_B1_AUDIT_SEEDS: 100
      CARDFRONT_B1_DECK_AUDIT_SEEDS: 1
      CARDFRONT_B1_OPENING_AUDIT_SEEDS: 1
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot archive
        uses: actions/cache@v4
        with:
          path: .godot-cache
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_ARCHIVE }}
      - name: Download Godot
        id: godot
        shell: pwsh
        run: |
          $cacheDir = Join-Path "${{ github.workspace }}" ".godot-cache"
          New-Item -ItemType Directory -Path $cacheDir -Force | Out-Null
          $archiveUrl = "https://github.com/godotengine/godot/releases/download/$env:GODOT_VERSION/$env:GODOT_ARCHIVE"
          $archivePath = Join-Path $cacheDir $env:GODOT_ARCHIVE
          $extractPath = Join-Path $env:RUNNER_TEMP "godot"
          if (-not (Test-Path $archivePath)) { Invoke-WebRequest -Uri $archiveUrl -OutFile $archivePath }
          Expand-Archive -Path $archivePath -DestinationPath $extractPath -Force
          $godotExe = Get-ChildItem -Path $extractPath -Recurse -Filter "*console.exe" | Select-Object -First 1
          if (-not $godotExe) { $godotExe = Get-ChildItem -Path $extractPath -Recurse -Filter "*.exe" | Select-Object -First 1 }
          if (-not $godotExe) { throw "Godot executable not found." }
          "path=$($godotExe.FullName)" >> $env:GITHUB_OUTPUT
      - name: Import Project
        shell: pwsh
        run: |
          & "${{ steps.godot.outputs.path }}" --headless --editor --audio-driver Dummy --path "${{ github.workspace }}" --quit
          exit $LASTEXITCODE
      - name: Run 5400 directional audit
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "${{ github.workspace }}/artifacts/test-logs" -Force | Out-Null
          $logPath = "${{ github.workspace }}/artifacts/test-logs/CardfrontB1BalanceAuditTestRunner-100-1.log"
          & "${{ steps.godot.outputs.path }}" --headless --audio-driver Dummy --path "${{ github.workspace }}" --script "res://scripts/tests/CardfrontB1BalanceAuditTestRunner.gd" *>&1 | Tee-Object -FilePath $logPath
          $exitCode = $LASTEXITCODE
          Get-Content -Path $logPath -Tail 300
          exit $exitCode
      - name: Upload heavy audit log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: b1-heavy-log-${{ github.run_id }}
          path: artifacts/test-logs/CardfrontB1BalanceAuditTestRunner-100-1.log
          if-no-files-found: error
          retention-days: 7
      - name: Upload B1 heavy balance artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cardfront-b1-audit-100-${{ github.run_id }}
          path: artifacts/cardfront-b1-balance-audit.*
          if-no-files-found: error
          retention-days: 14
