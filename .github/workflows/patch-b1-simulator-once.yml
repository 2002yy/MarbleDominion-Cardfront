name: Patch B1 Simulator Once

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/simulation-parity-b1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/simulation-parity-b1
          fetch-depth: 0
      - name: Patch paired RNG and hero card metrics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/cardfront/simulation/CardfrontB1BalanceMatchSimulator.gd')
          s=p.read_text(encoding='utf-8')
          reps=[
          ('var _b1_card_waste: Dictionary = {}\n', 'var _b1_card_waste: Dictionary = {}\nvar _b1_card_by_hero: Dictionary = {}\n'),
          ('\t\t"wasted_units": _b1_card_waste.duplicate(true),\n\t}', '\t\t"wasted_units": _b1_card_waste.duplicate(true),\n\t\t"by_hero": _b1_card_by_hero.duplicate(true),\n\t}'),
          ('\tfor raw_id in offer_ids:\n\t\t_increment_metric(_b1_card_appearances, str(raw_id), 1.0)\n', '\tfor raw_id in offer_ids:\n\t\t_increment_metric(_b1_card_appearances, str(raw_id), 1.0)\n\t\t_increment_hero_card_metric(state, "appearances", str(raw_id), 1.0)\n'),
          ('\t\t_increment_metric(_b1_card_selections, chosen_id, 1.0)\n', '\t\t_increment_metric(_b1_card_selections, chosen_id, 1.0)\n\t\t_increment_hero_card_metric(state, "selections", chosen_id, 1.0)\n'),
          ('\t\t\t_increment_metric(_b1_card_waste, chosen_id, waste)\n', '\t\t\t_increment_metric(_b1_card_waste, chosen_id, waste)\n\t\t\t_increment_hero_card_metric(state, "wasted_units", chosen_id, waste)\n'),
          ('\t_increment_metric(_b1_card_applications, upgrade_id, 1.0)\n', '\t_increment_metric(_b1_card_applications, upgrade_id, 1.0)\n\t_increment_hero_card_metric(state, "applications", upgrade_id, 1.0)\n'),
          ('\t_b1_card_waste = {}\n\tfor raw_id in B1UpgradeManifestScript.get_upgrade_ids():', '\t_b1_card_waste = {}\n\t_b1_card_by_hero = {}\n\tfor hero_id in B1HeroRegistryScript.get_hero_ids():\n\t\t_b1_card_by_hero[str(hero_id)] = {"appearances": {}, "selections": {}, "applications": {}, "wasted_units": {}}\n\tfor raw_id in B1UpgradeManifestScript.get_upgrade_ids():'),
          ('func _position_signature(map_id: String, side_variant: int) -> String:\n', 'func _increment_hero_card_metric(state: Dictionary, category: String, upgrade_id: String, amount: float) -> void:\n\tvar hero_id: String = str(state.get("hero_id", "unknown"))\n\tif not _b1_card_by_hero.has(hero_id):\n\t\t_b1_card_by_hero[hero_id] = {"appearances": {}, "selections": {}, "applications": {}, "wasted_units": {}}\n\tvar hero_metrics: Dictionary = _b1_card_by_hero[hero_id] as Dictionary\n\tvar category_metrics: Dictionary = hero_metrics.get(category, {}) as Dictionary\n\t_increment_metric(category_metrics, upgrade_id, amount)\n\thero_metrics[category] = category_metrics\n\n\nfunc _position_signature(map_id: String, side_variant: int) -> String:\n'),
          ('func _b1_stream_seed(seed_value: int, round_number: int, slot: String, side_variant: int) -> int:\n', 'func _b1_stream_seed(seed_value: int, round_number: int, slot: String, _side_variant: int) -> int:\n'),
          ('\t\t+ str(slot).hash() * 97\n\t\t+ int(side_variant) * 7919\n\t\t+ str(_b1_map_definition.get("id", "")).hash()\n', '\t\t+ str(slot).hash() * 97\n\t\t+ str(_b1_map_definition.get("id", "")).hash()\n'),
          ]
          for old,new in reps:
              if old not in s:
                  raise SystemExit('missing marker: '+old[:80])
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/cardfront/simulation/CardfrontB1BalanceMatchSimulator.gd
          git diff --cached --check
          git commit -m "v0.3.3a8 pair side RNG and split card metrics by hero"
          git push origin HEAD:agent/simulation-parity-b1
