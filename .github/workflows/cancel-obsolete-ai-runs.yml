name: Cancel Obsolete AI Runs

on:
  push:

permissions:
  actions: write
  contents: read

jobs:
  cancel-obsolete:
    if: github.ref_name == 'agent/shared-marginal-upgrade-ai'
    runs-on: ubuntu-latest
    steps:
      - name: Cancel older branch runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for status in queued in_progress; do
            curl -fsSL --get \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              --data-urlencode "branch=${GITHUB_REF_NAME}" \
              --data-urlencode "status=${status}" \
              --data-urlencode "per_page=100" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs" \
              | jq -r --arg current "${GITHUB_RUN_ID}" '.workflow_runs[] | select((.id | tostring) != $current) | .id' \
              | while read -r run_id; do
                  [ -n "${run_id}" ] || continue
                  echo "Cancelling obsolete run ${run_id}"
                  curl -fsSL -X POST \
                    -H "Accept: application/vnd.github+json" \
                    -H "Authorization: Bearer ${GH_TOKEN}" \
                    -H "X-GitHub-Api-Version: 2022-11-28" \
                    "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" \
                    >/dev/null || true
                done
          done
