name: Patch B1 Opponent Context Once

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/simulation-parity-b1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/simulation-parity-b1
          fetch-depth: 0
      - name: Patch opponent-aware value context
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/cardfront/simulation/CardfrontB1BalanceMatchSimulator.gd')
          s=p.read_text(encoding='utf-8')
          reps=[
          ('var _b1_card_by_hero: Dictionary = {}\n', 'var _b1_card_by_hero: Dictionary = {}\nvar _b1_states_by_owner: Dictionary = {}\n'),
          ('\t_b1_seed_value = int(seed_value)\n\t_reset_b1_metrics()\n', '\t_b1_seed_value = int(seed_value)\n\t_b1_states_by_owner = {}\n\t_reset_b1_metrics()\n'),
          ('\tstate["pending_repair_points"] = 0\n\treturn state\n', '\tstate["pending_repair_points"] = 0\n\t_b1_states_by_owner[int(owner_id)] = state\n\treturn state\n'),
          ('\tcontext["enemy_defense_points"] = float(_sum_owned_defense(state))\n\tcontext["route_pressure"] = _route_pressure_for_state(state)\n', '''\tvar owner_id: int = int(state.get("owner_id", 0))
\tvar opponent_id: int = 2 if owner_id == 1 else 1
\tvar opponent_state: Dictionary = _b1_states_by_owner.get(opponent_id, {}) as Dictionary
\tif opponent_state.is_empty():
\t\tcontext["enemy_defense_points"] = float(_sum_owned_defense(state))
\telse:
\t\tvar enemy_defense_points: int = _sum_owned_defense(opponent_state)
\t\tvar enemy_owned_cells: int = _count_owned_cells(opponent_state)
\t\tvar enemy_cap: int = maxi(1, int(opponent_state.get("territory_defense_cap", 1)))
\t\tcontext["enemy_defense_points"] = float(enemy_defense_points)
\t\tcontext["enemy_defense_contact_chance"] = clampf(
\t\t\t0.08
\t\t\t+ float(enemy_defense_points) / float(maxi(1, enemy_owned_cells)) * 0.09
\t\t\t+ float(enemy_cap) * 0.025,
\t\t\t0.0,
\t\t\t0.75
\t\t)
\tcontext["route_pressure"] = _route_pressure_for_state(state)
'''),
          ('func _sum_owned_defense(state: Dictionary) -> int:\n', '''func _count_owned_cells(state: Dictionary) -> int:
\tvar owned_cells: Array = state.get("virtual_owned_cells", []) as Array
\tvar total: int = 0
\tfor owned in owned_cells:
\t\tif bool(owned):
\t\t\ttotal += 1
\treturn total


func _sum_owned_defense(state: Dictionary) -> int:
'''),
          ]
          for old,new in reps:
              if old not in s:
                  raise SystemExit('missing marker: '+old[:100])
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/cardfront/simulation/CardfrontB1BalanceMatchSimulator.gd
          git diff --cached --check
          git commit -m "v0.3.3a8 feed opponent defense into shared AI"
          git push origin HEAD:agent/simulation-parity-b1
