func _test_siege_and_suppression_defense_contacts() -> void:
\tvar layer = FortifyLayerScript.new()
\tlayer.configure(4)
\tvar interceptor = CaptureInterceptorScript.new()
\tinterceptor.setup(layer)
\tvar cell := Vector2i(1, 1)
\tlayer.set_fortify_stack(cell, 1)
\t_assert.that(not interceptor.should_block_capture(cell, 1, 2, {"projectile_defense_pierce_remaining": 1}), "projectiles: siege captures through one layer")
\tlayer.set_fortify_stack(cell, 2)
\t_assert.that(interceptor.should_block_capture(cell, 1, 2, {"projectile_defense_pierce_remaining": 1}), "projectiles: siege alone does not capture through two layers")
\t_assert.eq(layer.get_fortify_stack(cell), 0, "projectiles: siege consumes two layers on blocked contact")
\tlayer.set_fortify_stack(cell, 1)
\t_assert.that(interceptor.should_block_capture(cell, 1, 2, {"projectile_type": ProjectileTypeScript.SUPPRESSION}), "projectiles: suppression consumes normal defense and is blocked")


