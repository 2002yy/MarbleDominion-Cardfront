name: Apply Projectile Types

on:
  push:
    branches:
      - agent/simulation-parity-b1

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/simulation-parity-b1
          fetch-depth: 0
      - name: Apply typed projectile runtime and B1 patches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('.')

          def read(path):
              return (ROOT / path).read_text(encoding='utf-8-sig')

          def write(path, text):
              (ROOT / path).write_text(text, encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one match, got {count}')
              return text.replace(old, new, 1)

          def replace_func(text, name, replacement):
              pattern = rf'(?ms)^func {re.escape(name)}\([^\n]*.*?(?=^func |\Z)'
              matches = list(re.finditer(pattern, text))
              if len(matches) != 1:
                  raise RuntimeError(f'{name}: expected one function, got {len(matches)}')
              m = matches[0]
              return text[:m.start()] + replacement.rstrip() + '\n\n' + text[m.end():]

          # Round director: pass the already-resolved typed sequence.
          path = 'scripts/cardfront/run/CardfrontRoundDirector.gd'
          text = read(path)
          text = replace_once(
              text,
              '''\t\t\t\tint(plan.chamber_damage_quarters),\n\t\t\t\tint(plan.armor_pierce_contacts)\n\t\t\t)''',
              '''\t\t\t\tint(plan.chamber_damage_quarters),\n\t\t\t\tint(plan.armor_pierce_contacts),\n\t\t\t\tplan.projectile_sequence\n\t\t\t)''',
              'round director typed payload',
          )
          write(path, text)

          # Turret: retain one sequence per burst and emit a per-projectile context.
          path = 'scripts/Turret.gd'
          text = read(path)
          text = replace_once(text, 'class_name Turret\n', 'class_name Turret\n\nconst CardfrontProjectileTypeScript = preload("res://scripts/cardfront/volley/CardfrontProjectileType.gd")\n', 'turret preload')
          text = replace_once(text, 'var burst_projectile_power: int = 1\n', 'var burst_projectile_power: int = 1\nvar burst_projectile_sequence: Array = []\n', 'turret sequence field')

          fire_burst = '''func fire_burst(count: int) -> void:
\tif is_destroyed:
\t\treturn
\tif battlefield == null or bullet_container == null:
\t\treturn
\tif burst_remaining > 0:
\t\treturn

\tburst_remaining = clampi(count, 1, GameConfig.get_max_pending_count())
\tburst_total = burst_remaining
\tburst_timer = 0.0
\tburst_index = 0
\tburst_origin_angle = rotation
\tburst_directed = false
\tburst_directed_angle = rotation
\tburst_directed_spread = 0.0
\tburst_projectile_power = 1
\tburst_projectile_sequence.clear()
\tCardfrontProjectileTypeScript.append_standard(burst_projectile_sequence, burst_remaining)
\tburst_chamber_damage_quarters = 0
\tburst_capture_context = {}
\tdirected_visual_hold_remaining = 0.0
\tburst_progress_emit_timer = 0.0
\tburst_last_reported_remaining = burst_remaining
\tburst_progress.emit(faction_id, burst_remaining)
\t_set_burst_locked(true)'''
          text = replace_func(text, 'fire_burst', fire_burst)

          request_burst = '''func request_directed_burst(intent) -> bool:
\tif intent == null:
\t\treturn false
\tvar started: bool = fire_directed(
\t\tint(intent.shot_count),
\t\tfloat(intent.angle),
\t\tfloat(intent.spread),
\t\tint(intent.get("projectile_power"))
\t)
\tif started:
\t\tburst_chamber_damage_quarters = maxi(0, int(intent.get("chamber_damage_quarters")))
\t\tburst_projectile_sequence.clear()
\t\tvar raw_sequence = intent.get("projectile_sequence")
\t\tif raw_sequence is Array:
\t\t\tburst_projectile_sequence = (raw_sequence as Array).duplicate()
\t\tif burst_projectile_sequence.size() > burst_remaining:
\t\t\tburst_projectile_sequence.resize(burst_remaining)
\t\twhile burst_projectile_sequence.size() < burst_remaining:
\t\t\tburst_projectile_sequence.append(CardfrontProjectileTypeScript.STANDARD)
\t\tburst_capture_context = {
\t\t\t"armor_pierce_pool": {
\t\t\t\t"remaining": maxi(0, int(intent.get("armor_pierce_contacts"))),
\t\t\t},
\t\t}
\treturn started'''
          text = replace_func(text, 'request_directed_burst', request_burst)

          fire_directed = '''func fire_directed(count: int, angle: float, spread: float = 0.0, projectile_power: int = 1) -> bool:
\tif is_destroyed:
\t\treturn false
\tif battlefield == null or bullet_container == null:
\t\treturn false
\tif burst_remaining > 0:
\t\treturn false

\tburst_remaining = clampi(count, 1, GameConfig.get_max_pending_count())
\tburst_total = burst_remaining
\tburst_timer = 0.0
\tburst_index = 0
\tburst_origin_angle = float(angle)
\tburst_directed = true
\tburst_directed_angle = float(angle)
\tburst_directed_spread = maxf(0.0, float(spread))
\tburst_projectile_power = clampi(int(projectile_power), 1, 999)
\tburst_projectile_sequence.clear()
\tCardfrontProjectileTypeScript.append_standard(burst_projectile_sequence, burst_remaining)
\tburst_chamber_damage_quarters = 0
\tburst_capture_context = {}
\tdirected_visual_hold_remaining = DIRECTED_VISUAL_HOLD_SECONDS
\tburst_progress_emit_timer = 0.0
\tburst_last_reported_remaining = burst_remaining
\tburst_progress.emit(faction_id, burst_remaining)
\t_set_burst_locked(true)
\tqueue_redraw()
\treturn true'''
          text = replace_func(text, 'fire_directed', fire_directed)

          cancel_burst = '''func cancel_burst() -> int:
\tvar remaining: int = burst_remaining
\tburst_remaining = 0
\tburst_total = 0
\tburst_index = 0
\tburst_timer = 0.0
\tburst_directed = false
\tburst_directed_spread = 0.0
\tburst_projectile_power = 1
\tburst_projectile_sequence.clear()
\tburst_chamber_damage_quarters = 0
\tburst_capture_context = {}
\tdirected_visual_hold_remaining = 0.0
\tburst_progress_emit_timer = 0.0
\tburst_last_reported_remaining = 0
\tburst_progress.emit(faction_id, 0)
\t_set_burst_locked(false)
\treturn remaining'''
          text = replace_func(text, 'cancel_burst', cancel_burst)

          spawn_bullet = '''func _spawn_bullet() -> void:
\tif bullet_container == null:
\t\treturn

\tvar shot_angle: float = _current_burst_shot_angle()
\tvar shot_direction: Vector2 = Vector2.RIGHT.rotated(shot_angle).normalized()
\tvar muzzle_distance: float = GameConfig.TURRET_RADIUS + 17.0
\tvar spawn_position: Vector2 = global_position + shot_direction * muzzle_distance
\tvar projectile_type: String = CardfrontProjectileTypeScript.STANDARD
\tif burst_index >= 0 and burst_index < burst_projectile_sequence.size():
\t\tprojectile_type = CardfrontProjectileTypeScript.sanitize(str(burst_projectile_sequence[burst_index]))
\tvar armor_pool = burst_capture_context.get("armor_pierce_pool", {"remaining": 0})
\tvar projectile_context: Dictionary = {
\t\t"projectile_type": projectile_type,
\t\t"projectile_defense_pierce_remaining": CardfrontProjectileTypeScript.defense_pierce_layers(projectile_type),
\t\t"armor_pierce_pool": armor_pool,
\t}

\tif _bullet_container_can_spawn:
\t\tbullet_container.spawn_bullet(
\t\t\tfaction_id,
\t\t\tspawn_position,
\t\t\tshot_direction,
\t\t\tbattlefield,
\t\t\tall_turrets,
\t\t\tburst_projectile_power,
\t\t\tburst_chamber_damage_quarters,
\t\t\tprojectile_context
\t\t)
\telse:
\t\tvar bullet = Bullet.new()
\t\tbullet.setup(
\t\t\tfaction_id,
\t\t\tspawn_position,
\t\t\tshot_direction,
\t\t\tbattlefield,
\t\t\tall_turrets,
\t\t\tburst_projectile_power,
\t\t\tburst_chamber_damage_quarters,
\t\t\tprojectile_context
\t\t)
\t\tbullet_container.add_child(bullet)'''
          text = replace_func(text, '_spawn_bullet', spawn_bullet)

          # Reset typed state in restore and destruction paths.
          text = replace_once(text, '\tburst_projectile_power = clampi(int(state.get("turret_burst_projectile_power", 1)), 1, 999)\n\tburst_chamber_damage_quarters = 0', '\tburst_projectile_power = clampi(int(state.get("turret_burst_projectile_power", 1)), 1, 999)\n\tburst_projectile_sequence.clear()\n\tburst_chamber_damage_quarters = 0', 'turret restore reset')
          text = replace_once(text, '\t\tburst_projectile_power = 1\n\t\tburst_chamber_damage_quarters = 0', '\t\tburst_projectile_power = 1\n\t\tburst_projectile_sequence.clear()\n\t\tburst_chamber_damage_quarters = 0', 'turret destroyed restore reset')
          text = replace_once(text, '\tburst_projectile_power = 1\n\tburst_chamber_damage_quarters = 0\n\tburst_capture_context = {}\n\tburst_last_reported_remaining = 0', '\tburst_projectile_power = 1\n\tburst_projectile_sequence.clear()\n\tburst_chamber_damage_quarters = 0\n\tburst_capture_context = {}\n\tburst_last_reported_remaining = 0', 'turret destroy reset')
          write(path, text)

          # Bullet: visible type and type-specific chamber behavior.
          path = 'scripts/Bullet.gd'
          text = read(path)
          text = replace_once(text, 'class_name Bullet\n', 'class_name Bullet\n\nconst CardfrontProjectileTypeScript = preload("res://scripts/cardfront/volley/CardfrontProjectileType.gd")\n', 'bullet preload')
          text = replace_once(text, 'var damage_power: int = 1\n', 'var damage_power: int = 1\nvar projectile_type: String = CardfrontProjectileTypeScript.STANDARD\n', 'bullet type field')
          text = replace_once(text, '\tcapture_context = new_capture_context\n\tspeed = GameConfig.BULLET_SPEED', '\tcapture_context = new_capture_context\n\tprojectile_type = CardfrontProjectileTypeScript.sanitize(str(capture_context.get("projectile_type", CardfrontProjectileTypeScript.STANDARD)))\n\tspeed = GameConfig.BULLET_SPEED', 'bullet setup type')
          text = replace_once(text, '\tcapture_context = {}\n\troute_filter = null', '\tcapture_context = {}\n\tprojectile_type = CardfrontProjectileTypeScript.STANDARD\n\troute_filter = null', 'bullet deactivate type')

          turret_hit = '''func _try_hit_enemy_turret() -> bool:
\tfor target_faction_id in target_turrets:
\t\tif target_faction_id == faction_id:
\t\t\tcontinue
\t\tvar turret = target_turrets[target_faction_id]
\t\tif turret == null or turret.is_destroyed:
\t\t\tcontinue
\t\tvar hit_radius_sq: float = GameConfig.TURRET_HIT_RADIUS * GameConfig.TURRET_HIT_RADIUS
\t\tif global_position.distance_squared_to(turret.global_position) > hit_radius_sq:
\t\t\tcontinue
\t\tvar damage_multiplier: int = CardfrontProjectileTypeScript.chamber_damage_multiplier(projectile_type)
\t\tif damage_multiplier > 0:
\t\t\tif chamber_damage_quarters > 0 and turret.has_method("take_damage_quarters"):
\t\t\t\tturret.take_damage_quarters(chamber_damage_quarters * damage_power * damage_multiplier)
\t\t\telse:
\t\t\t\tturret.take_damage(GameConfig.BULLET_DAMAGE * damage_power * damage_multiplier)
\t\treturn true
\treturn false'''
          text = replace_func(text, '_try_hit_enemy_turret', turret_hit)

          visual_helpers = '''func get_projectile_visual_signature() -> Dictionary:
\treturn {
\t\t"projectile_type": projectile_type,
\t\t"fill": _projectile_visual_color(),
\t\t"special_ring": projectile_type != CardfrontProjectileTypeScript.STANDARD,
\t}


func _projectile_visual_color() -> Color:
\tvar faction_color: Color = GameConfig.faction_color(faction_id)
\tmatch projectile_type:
\t\tCardfrontProjectileTypeScript.SIEGE:
\t\t\treturn faction_color.lerp(Color(1.0, 0.56, 0.10), 0.72)
\t\tCardfrontProjectileTypeScript.SUPPRESSION:
\t\t\treturn faction_color.lerp(Color(0.18, 0.88, 1.0), 0.68)
\t\t_:
\t\t\treturn faction_color
'''
          marker = 'func _visual_radius() -> float:'
          if marker not in text:
              raise RuntimeError('bullet visual marker missing')
          text = text.replace(marker, visual_helpers + '\n\n' + marker, 1)
          text = replace_once(text, '\tvar base = GameConfig.faction_color(faction_id)\n', '\tvar base: Color = _projectile_visual_color()\n', 'bullet visual base')
          text = replace_once(text, '''\tif simple_draw:\n\t\tdraw_circle(Vector2.ZERO, radius, base)\n\t\treturn''', '''\tif simple_draw:\n\t\tdraw_circle(Vector2.ZERO, radius, base)\n\t\tif projectile_type != CardfrontProjectileTypeScript.STANDARD:\n\t\t\tdraw_arc(Vector2.ZERO, radius + 1.0, 0.0, TAU, 16, Color.WHITE, 1.2)\n\t\treturn''', 'bullet simple visual')
          text = replace_once(text, '\tdraw_circle(Vector2.ZERO, radius * 0.25, Color(1.0, 1.0, 1.0, 0.14))\n', '''\tdraw_circle(Vector2.ZERO, radius * 0.25, Color(1.0, 1.0, 1.0, 0.14))\n\tif projectile_type == CardfrontProjectileTypeScript.SIEGE:\n\t\tdraw_arc(Vector2.ZERO, radius + 1.8, 0.0, TAU, 20, Color(1.0, 0.82, 0.30, 0.95), 2.0)\n\t\tdraw_line(Vector2(-radius * 0.55, 0.0), Vector2(radius * 0.55, 0.0), Color(0.22, 0.10, 0.02, 0.9), 1.6)\n\telif projectile_type == CardfrontProjectileTypeScript.SUPPRESSION:\n\t\tdraw_arc(Vector2.ZERO, radius + 1.8, 0.0, TAU, 20, Color(0.35, 0.96, 1.0, 0.95), 2.0)\n\t\tdraw_circle(Vector2.ZERO, radius * 0.42, Color(0.02, 0.20, 0.30, 0.72), false, 1.4)\n''', 'bullet special visuals')
          write(path, text)

          # Capture interceptor: card pierce + siege pierce + engineer captured-front passive.
          path = 'scripts/cardfront/fortify/CardfrontCaptureInterceptor.gd'
          write(path, '''extends RefCounted
class_name CardfrontCaptureInterceptor

var fortify_layer = null
var round_director = null
var territory_defense_system = null


func setup(new_fortify_layer) -> void:
\tfortify_layer = new_fortify_layer


func configure_runtime(new_round_director, new_territory_defense_system) -> void:
\tround_director = new_round_director
\tterritory_defense_system = new_territory_defense_system


func should_block_capture(
\tcell: Vector2i,
\tincoming_owner: int,
\tcurrent_owner: int,
\tcapture_context: Dictionary = {}
) -> bool:
\tif incoming_owner == current_owner or fortify_layer == null:
\t\treturn false
\tif fortify_layer.get_fortify_stack(cell) <= 0:
\t\treturn false

\tvar armor_pool = capture_context.get("armor_pierce_pool", null)
\tif armor_pool is Dictionary and int((armor_pool as Dictionary).get("remaining", 0)) > 0:
\t\t(armor_pool as Dictionary)["remaining"] = int((armor_pool as Dictionary)["remaining"]) - 1
\t\tfortify_layer.consume_hit(cell)
\t\tif fortify_layer.get_fortify_stack(cell) <= 0:
\t\t\treturn false
\telif maxi(0, int(capture_context.get("armor_pierce_contacts_remaining", 0))) > 0:
\t\tcapture_context["armor_pierce_contacts_remaining"] = int(capture_context["armor_pierce_contacts_remaining"]) - 1
\t\tfortify_layer.consume_hit(cell)
\t\tif fortify_layer.get_fortify_stack(cell) <= 0:
\t\t\treturn false

\tvar projectile_pierce: int = maxi(0, int(capture_context.get("projectile_defense_pierce_remaining", 0)))
\tif projectile_pierce > 0 and fortify_layer.get_fortify_stack(cell) > 0:
\t\tcapture_context["projectile_defense_pierce_remaining"] = projectile_pierce - 1
\t\tfortify_layer.consume_hit(cell)
\t\tif fortify_layer.get_fortify_stack(cell) <= 0:
\t\t\treturn false
\treturn fortify_layer.consume_hit(cell)


func on_capture_applied(
\tcell: Vector2i,
\tincoming_owner: int,
\t_current_owner: int,
\t_capture_context: Dictionary = {}
) -> void:
\tif fortify_layer == null or round_director == null or territory_defense_system == null:
\t\treturn
\tif not round_director.has_method("get_run_state"):
\t\treturn
\tvar run_state = round_director.get_run_state(int(incoming_owner))
\tif run_state == null:
\t\treturn
\tvar captured_defense: int = clampi(
\t\tint(run_state.captured_frontline_defense),
\t\t0,
\t\tint(run_state.territory_defense_cap)
\t)
\tif captured_defense <= 0 or not _is_frontline_cell(cell, incoming_owner):
\t\treturn
\tfortify_layer.set_fortify_stack(cell, captured_defense)


func _is_frontline_cell(cell: Vector2i, owner_id: int) -> bool:
\tvar battlefield = territory_defense_system.battlefield
\tif battlefield == null or not is_instance_valid(battlefield):
\t\treturn false
\tfor offset in [Vector2i.LEFT, Vector2i.RIGHT, Vector2i.UP, Vector2i.DOWN]:
\t\tvar neighbor: Vector2i = cell + offset
\t\tif not battlefield.is_inside(neighbor):
\t\t\tcontinue
\t\tif int(battlefield.owners[neighbor.x][neighbor.y]) != int(owner_id):
\t\t\treturn true
\treturn false
''')

          # Notify interceptor after a successful owner change.
          path = 'scripts/Battlefield.gd'
          text = read(path)
          text = replace_once(text, '''\towners[cell.x][cell.y] = faction_id\n\t_add_owner_count(old, -1)\n\t_add_owner_count(faction_id, 1)''', '''\towners[cell.x][cell.y] = faction_id\n\t_add_owner_count(old, -1)\n\t_add_owner_count(faction_id, 1)\n\tif capture_interceptor != null and is_instance_valid(capture_interceptor) and capture_interceptor.has_method("on_capture_applied"):\n\t\tcapture_interceptor.on_capture_applied(cell, faction_id, old, capture_context)''', 'battlefield bullet post capture')
          text = replace_once(text, '''\towners[cell.x][cell.y] = new_owner_id\n\t_add_owner_count(old, -1)\n\t_add_owner_count(new_owner_id, 1)''', '''\towners[cell.x][cell.y] = new_owner_id\n\t_add_owner_count(old, -1)\n\t_add_owner_count(new_owner_id, 1)\n\tif capture_interceptor != null and is_instance_valid(capture_interceptor) and capture_interceptor.has_method("on_capture_applied"):\n\t\tcapture_interceptor.on_capture_applied(cell, new_owner_id, old, {})''', 'battlefield owner post capture')
          write(path, text)

          # Bind runtime refs once the round and defense systems both exist.
          path = 'scripts/cardfront/defense/CardfrontTerritoryDefenseSystem.gd'
          text = read(path)
          text = replace_once(text, '''\tif round_director.has_method("set_territory_defense_system"):\n\t\tround_director.set_territory_defense_system(self)\n\tvar launch_callable''', '''\tif round_director.has_method("set_territory_defense_system"):\n\t\tround_director.set_territory_defense_system(self)\n\tvar interceptor = battlefield.capture_interceptor\n\tif interceptor != null and interceptor.has_method("configure_runtime"):\n\t\tinterceptor.configure_runtime(round_director, self)\n\tvar launch_callable''', 'defense interceptor runtime binding')
          write(path, text)

          # B1 typed simulation.
          path = 'scripts/cardfront/simulation/CardfrontB1BalanceMatchSimulator.gd'
          text = read(path)
          text = replace_once(text, 'const B1UpgradeManifestScript = preload("res://scripts/cardfront/draft/CardfrontUpgradeManifest.gd")\n', 'const B1UpgradeManifestScript = preload("res://scripts/cardfront/draft/CardfrontUpgradeManifest.gd")\nconst B1ProjectileTypeScript = preload("res://scripts/cardfront/volley/CardfrontProjectileType.gd")\n', 'B1 projectile preload')
          text = replace_once(text, 'var _b1_card_by_hero: Dictionary = {}\n', 'var _b1_card_by_hero: Dictionary = {}\nvar _b1_projectile_fired: Dictionary = {}\nvar _b1_projectile_chamber_contacts: Dictionary = {}\nvar _b1_projectile_damage_units: Dictionary = {}\nvar _b1_projectile_defense_pierce: Dictionary = {}\n', 'B1 projectile metrics fields')
          text = replace_once(text, '''\tmetrics["virtual_recaptures"] = _b1_virtual_recaptures\n\tresult["metrics"] = metrics''', '''\tmetrics["virtual_recaptures"] = _b1_virtual_recaptures\n\tmetrics["projectile_fired"] = _b1_projectile_fired.duplicate(true)\n\tmetrics["projectile_chamber_contacts"] = _b1_projectile_chamber_contacts.duplicate(true)\n\tmetrics["projectile_damage_units"] = _b1_projectile_damage_units.duplicate(true)\n\tmetrics["projectile_defense_pierce"] = _b1_projectile_defense_pierce.duplicate(true)\n\tresult["metrics"] = metrics''', 'B1 result projectile metrics')
          text = replace_once(text, '''\tstate["starting_contact_front_defense"] = contact_defense\n\tstate["pending_repair_points"] = 0''', '''\tstate["starting_contact_front_defense"] = contact_defense\n\tstate["base_projectile_mix"] = (definition.get("base_projectile_mix", {}) as Dictionary).duplicate(true)\n\tstate["captured_frontline_defense"] = clampi(int(definition.get("captured_frontline_defense", 0)), 0, int(state.get("territory_defense_cap", 1)))\n\tstate["frontline_repair_bonus"] = maxi(0, int(definition.get("frontline_repair_bonus", 0)))\n\tstate["pending_repair_points"] = 0''', 'B1 state projectile/passives')
          text = replace_once(text, 'var amount: int = maxi(0, int(params.get("amount", 0)))\n\t\tvar applied: int = _repair_virtual_cells(state, amount)', 'var amount: int = maxi(0, int(params.get("amount", 0))) + maxi(0, int(state.get("frontline_repair_bonus", 0)))\n\t\tvar applied: int = _repair_virtual_cells(state, amount)', 'B1 engineer repair bonus')

          build_fast = '''func _build_and_consume_volley_fast(state: Dictionary) -> Dictionary:
\tvar bonus: int = maxi(0, int(state.get("next_volley_bonus", 0)))
\tvar multiplier: int = maxi(1, int(state.get("next_volley_multiplier", 1)))
\tvar sequence: Array = B1ProjectileTypeScript.build_sequence(
\t\tstate.get("base_projectile_mix", {}) as Dictionary,
\t\tbonus,
\t\tmultiplier,
\t\t24
\t)
\tvar result: Dictionary = {
\t\t"shot_count": sequence.size(),
\t\t"projectile_sequence": sequence,
\t\t"projectile_counts": B1ProjectileTypeScript.count_types(sequence),
\t\t"attack_level": clampi(int(state.get("attack_level", 0)), 0, 3),
\t\t"armor_pierce_contacts": maxi(0, int(state.get("next_volley_armor_pierce_contacts", 0))),
\t}
\tstate["next_volley_bonus"] = 0
\tstate["next_volley_multiplier"] = 1
\tstate["next_volley_armor_pierce_contacts"] = 0
\treturn result'''
          marker = 'func _proxy_value_context(state: Dictionary) -> Dictionary:'
          if marker not in text:
              raise RuntimeError('B1 build insertion marker missing')
          text = text.replace(marker, build_fast + '\n\n\n' + marker, 1)

          resolve_volley = '''func _resolve_volley(
\tattacker_slot: String,
\ttarget_slot: String,
\tplan_data: Dictionary,
\tstates: Dictionary,
\tterritory: Dictionary,
\t_defense_pool: Dictionary,
