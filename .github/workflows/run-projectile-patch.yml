# Trigger existing one-shot workflow.
name: Run Projectile Patch

on:
  push:
    branches:
      - agent/simulation-parity-b1

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/simulation-parity-b1
          fetch-depth: 0
      - name: Execute stored one-shot patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-projectile-types.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          lines = workflow[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          script = script.replace('\t', '    ')
          compile(script, 'stored-projectile-patch', 'exec')
          exec(script, {'__name__': '__main__'})
          Path('.github/workflows/run-projectile-patch.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "combat: implement visible projectile roles"
          git push origin HEAD:agent/simulation-parity-b1
