name: Shared Upgrade AI Tests

on:
  push:
    branches:
      - main
    paths:
      - scripts/**
      - assets/**
      - project.godot
      - .github/workflows/shared-upgrade-ai-tests.yml
  pull_request:
    paths:
      - scripts/**
      - assets/**
      - project.godot
      - .github/workflows/shared-upgrade-ai-tests.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-upgrade-ai-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.1-stable
  GODOT_ARCHIVE: Godot_v4.7.1-stable_win64.exe.zip

jobs:
  shared-upgrade-policy:
    name: Shared marginal value policy
    runs-on: windows-latest
    env:
      CARDFRONT_SHARED_AI_AUDIT_SEEDS: 1
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot archive
        uses: actions/cache@v4
        with:
          path: .godot-cache
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_ARCHIVE }}

      - name: Download Godot
        id: godot
        shell: pwsh
        run: |
          $cacheDir = Join-Path "${{ github.workspace }}" ".godot-cache"
          New-Item -ItemType Directory -Path $cacheDir -Force | Out-Null
          $archiveUrl = "https://github.com/godotengine/godot/releases/download/$env:GODOT_VERSION/$env:GODOT_ARCHIVE"
          $archivePath = Join-Path $cacheDir $env:GODOT_ARCHIVE
          $extractPath = Join-Path $env:RUNNER_TEMP "godot"
          if (-not (Test-Path $archivePath)) {
            Invoke-WebRequest -Uri $archiveUrl -OutFile $archivePath
          }
          Expand-Archive -Path $archivePath -DestinationPath $extractPath -Force
          $godotExe = Get-ChildItem -Path $extractPath -Recurse -Filter "*console.exe" | Select-Object -First 1
          if (-not $godotExe) {
            $godotExe = Get-ChildItem -Path $extractPath -Recurse -Filter "*.exe" | Select-Object -First 1
          }
          if (-not $godotExe) {
            throw "Godot executable not found after extraction."
          }
          "path=$($godotExe.FullName)" >> $env:GITHUB_OUTPUT

      - name: Import Project
        shell: pwsh
        run: |
          & "${{ steps.godot.outputs.path }}" --headless --editor --audio-driver Dummy --path "${{ github.workspace }}" --quit

      - name: Run shared marginal value policy
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "${{ github.workspace }}/artifacts/test-logs" -Force | Out-Null
          $logPath = "${{ github.workspace }}/artifacts/test-logs/CardfrontUpgradeValuePolicyTestRunner.gd.log"
          & "${{ steps.godot.outputs.path }}" --headless --audio-driver Dummy --path "${{ github.workspace }}" --script "res://scripts/tests/CardfrontUpgradeValuePolicyTestRunner.gd" *>&1 | Tee-Object -FilePath $logPath | Out-Null
          $exitCode = $LASTEXITCODE
          Get-Content -Path $logPath -Tail 200
          exit $exitCode

      - name: Upload shared policy log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shared-ai-policy-log-${{ github.run_id }}
          path: artifacts/test-logs/CardfrontUpgradeValuePolicyTestRunner.gd.log
          if-no-files-found: error
          retention-days: 7

  shared-ai-heavy-audit:
    name: Shared AI 5400 parity proxy audit
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    env:
      CARDFRONT_SHARED_AI_AUDIT_SEEDS: 100
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot archive
        uses: actions/cache@v4
        with:
          path: .godot-cache
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_ARCHIVE }}

      - name: Download Godot
        id: godot
        shell: pwsh
        run: |
          $cacheDir = Join-Path "${{ github.workspace }}" ".godot-cache"
          New-Item -ItemType Directory -Path $cacheDir -Force | Out-Null
          $archiveUrl = "https://github.com/godotengine/godot/releases/download/$env:GODOT_VERSION/$env:GODOT_ARCHIVE"
          $archivePath = Join-Path $cacheDir $env:GODOT_ARCHIVE
          $extractPath = Join-Path $env:RUNNER_TEMP "godot"
          if (-not (Test-Path $archivePath)) {
            Invoke-WebRequest -Uri $archiveUrl -OutFile $archivePath
          }
          Expand-Archive -Path $archivePath -DestinationPath $extractPath -Force
          $godotExe = Get-ChildItem -Path $extractPath -Recurse -Filter "*console.exe" | Select-Object -First 1
          if (-not $godotExe) {
            $godotExe = Get-ChildItem -Path $extractPath -Recurse -Filter "*.exe" | Select-Object -First 1
          }
          if (-not $godotExe) {
            throw "Godot executable not found after extraction."
          }
          "path=$($godotExe.FullName)" >> $env:GITHUB_OUTPUT

      - name: Import Project
        shell: pwsh
        run: |
          & "${{ steps.godot.outputs.path }}" --headless --editor --audio-driver Dummy --path "${{ github.workspace }}" --quit

      - name: Run shared AI 5400 parity proxy audit
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "${{ github.workspace }}/artifacts/test-logs" -Force | Out-Null
          $logPath = "${{ github.workspace }}/artifacts/test-logs/CardfrontSharedAiParityAuditTestRunner.gd.log"
          & "${{ steps.godot.outputs.path }}" --headless --audio-driver Dummy --path "${{ github.workspace }}" --script "res://scripts/tests/CardfrontSharedAiParityAuditTestRunner.gd" *>&1 | Tee-Object -FilePath $logPath | Out-Null
          $exitCode = $LASTEXITCODE
          Get-Content -Path $logPath -Tail 200
          exit $exitCode

      - name: Upload heavy shared AI log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shared-ai-heavy-log-${{ github.run_id }}
          path: artifacts/test-logs/CardfrontSharedAiParityAuditTestRunner.gd.log
          if-no-files-found: error
          retention-days: 7

      - name: Upload shared AI audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cardfront-shared-ai-parity-audit-${{ github.run_id }}
          path: artifacts/cardfront-shared-ai-parity-audit.*
          if-no-files-found: error
          retention-days: 14
