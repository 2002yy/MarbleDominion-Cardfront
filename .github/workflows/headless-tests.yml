name: Headless Tests

on:
  push:
    branches:
      - main
    paths:
      - scripts/**
      - assets/**
      - project.godot
      - .github/workflows/headless-tests.yml
  pull_request:
    paths:
      - scripts/**
      - assets/**
      - project.godot
      - .github/workflows/headless-tests.yml

permissions:
  contents: read

concurrency:
  group: headless-tests-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  godot-headless:
    name: ${{ matrix.batch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - batch: Baseline and map economy
            scripts: |
              SmokeTestRunner.gd
              IntegrationTestRunner.gd
              LayoutSanityTestRunner.gd
              StartMenuSceneTestRunner.gd
              GameHUDSceneTestRunner.gd
              EventRouletteSceneTestRunner.gd
              SettingsPanelSceneTestRunner.gd
              GameStateCoordinatorTestRunner.gd
              SaveFlowControllerTestRunner.gd
              RestorePlanTestRunner.gd
              EndToEndContinueMainTestRunner.gd
              SettingsAndResultTestRunner.gd
              RegionMapTestRunner.gd
              CardfrontMapDefinitionTestRunner.gd
              CardfrontMapReadabilityTestRunner.gd
              NeutralOwnerCompatibilityTestRunner.gd
              DeploymentRulesTestRunner.gd
              RegionMoraleTestRunner.gd
              EconomyTickTestRunner.gd
              EconomyDebugPanelSceneTestRunner.gd
              CardfrontVisualPolicyTestRunner.gd
              VisualPressurePolicyTestRunner.gd
          - batch: Cards effects and fire
            scripts: |
              FortifyLayerTestRunner.gd
              CardfrontContentValidationTestRunner.gd
              CardfrontTargetValidatorTestRunner.gd
              CardEffectResolverTestRunner.gd
              CardCoreLiteTestRunner.gd
              CardFirstEffectsTestRunner.gd
              CardfrontTargetBiasTestRunner.gd
              PioneerBeaconLiteTestRunner.gd
              CardfrontFireDirectorTestRunner.gd
              CardfrontFireDirectorTurretIntegrationTestRunner.gd
              CardfrontFireDirectorSignalTestRunner.gd
              CardfrontControlChamberDecouplingTestRunner.gd
          - batch: Devices visuals and interaction
            scripts: |
              DeviceCoreTestRunner.gd
              AbsorberCoreLiteTestRunner.gd
              EngineerBotLiteTestRunner.gd
              DurablePioneerBeaconTestRunner.gd
              DeviceOverlayLayerTestRunner.gd
              CardfrontBottomHudStatusTestRunner.gd
              CardfrontVfxLayerTestRunner.gd
              CardfrontVisibleEffectBridgeTestRunner.gd
              CardfrontRuntimeSnapshotTestRunner.gd
              CardfrontRuntimeBuilderTestRunner.gd
              CardfrontFormalUITestRunner.gd
              CardfrontTargetPreviewTestRunner.gd
              CardfrontBattlefieldClickSelectionTestRunner.gd
              CardfrontRegionControlBlockTestRunner.gd
              CardfrontCardArtBindingTestRunner.gd
              CardfrontCardDetailPopupTestRunner.gd
              CardfrontCardFeedbackTestRunner.gd
              CardfrontDisabledCardFeedbackTestRunner.gd
              CardfrontActionHintTestRunner.gd
              CardfrontToastLayerTestRunner.gd
              CardfrontEffectVisualBridgeTestRunner.gd
              CardfrontCardHoverMotionTestRunner.gd
              CardfrontHandPanelGuidanceTestRunner.gd
              CardfrontTargetPreviewGuidanceTestRunner.gd
          - batch: UI art debug and performance
            scripts: |
              CardfrontDebugPanelToggleTestRunner.gd
              CardfrontUiAssetRegistryTestRunner.gd
              CardfrontUiArtSceneTestRunner.gd
              CardfrontCardViewInteractionConfigTestRunner.gd
              CardfrontHandRealHitboxTestRunner.gd
              CardfrontHandCollapseLayoutTestRunner.gd
              CardfrontUiClickThroughTestRunner.gd
              CardfrontRegionInfoPanelVisibilityTestRunner.gd
              CardfrontTopResourceBarMinimalTestRunner.gd
              CardfrontMatchFlowClarityTestRunner.gd
              CardfrontPerformanceSmokeTestRunner.gd
          - batch: Core loop and arena
            scripts: |
              CardfrontUpgradeContentTestRunner.gd
              CardfrontMatchPhaseControllerTestRunner.gd
              CardfrontUpgradeResolverTestRunner.gd
              CardfrontEchoLevelContractTestRunner.gd
              CardfrontLevelSemanticSeparationTestRunner.gd
              CardfrontSelectedLevelSnapshotTestRunner.gd
              CardfrontEntityCardRuntimeTestRunner.gd
              CardfrontArmoredGuardTestRunner.gd
              CardfrontSapperUnitTestRunner.gd
              CardfrontNeutralCreatureTestRunner.gd
              CardfrontEntityAnimationTestRunner.gd
              CardfrontEntityRuntimeBoundaryTestRunner.gd
              CardfrontEntityPresentationFeedbackTestRunner.gd
              CardfrontArenaLayoutTestRunner.gd
              CardfrontGridExtentMatrixTestRunner.gd
              CardfrontDirectionControllerTestRunner.gd
              CardfrontArenaRuntimeTestRunner.gd
              CardfrontOrthographicArenaTestRunner.gd
              CardfrontBattlefieldScaleTestRunner.gd
              CardfrontEnvironmentAssetTestRunner.gd
              CardfrontEighteenCardReadabilityTestRunner.gd
              CardfrontPrematchFlowTestRunner.gd
          - batch: Draft and support identity
            scripts: |
              CardfrontDraftGeometrySnapshotTestRunner.gd
              CardfrontDraftLifecycleSnapshotTestRunner.gd
              CardfrontDraftOfferIndependenceTestRunner.gd
              CardfrontDraftSideRngIsolationTestRunner.gd
              CardfrontThreeChoiceRuntimeTestRunner.gd
              CardfrontRoundCombatTestRunner.gd
              CardfrontModeSmokeTestRunner.gd
              CardfrontP0GoldenBaselineTestRunner.gd
              CardfrontSupportIdentityTestRunner.gd
              CardfrontSupportStateTestRunner.gd
              CardfrontSupportPresentationContractTestRunner.gd
              CardfrontSupportPresentationLifecycleTestRunner.gd
              CardfrontDeploymentZoneVisualizationTestRunner.gd
              CardfrontSupportRegionMapperTestRunner.gd
              CardfrontSupportMapMetadataTestRunner.gd
          - batch: Support capture graph and routes
            scripts: |
              CardfrontSupportCaptureContributorTestRunner.gd
              CardfrontSupportCaptureProfileTestRunner.gd
              CardfrontSupportCaptureAggregatorTestRunner.gd
              CardfrontSupportCaptureStateMachineTestRunner.gd
              CardfrontSupportCaptureOccupancyAdapterTestRunner.gd
              CardfrontSupportCaptureTerritoryPrototypeTestRunner.gd
              CardfrontSupportSnapshotContractTestRunner.gd
              CardfrontSupportTopologyContractTestRunner.gd
              CardfrontSupportTopologyValidatorTestRunner.gd
              CardfrontSupportConnectivityResolverTestRunner.gd
              CardfrontSupportConnectivityTruthTestRunner.gd
              CardfrontSupportConnectivityCacheTestRunner.gd
              CardfrontRouteSemanticsTestRunner.gd
          - batch: Deployment and tactical foundations
            scripts: |
              CardfrontDeploymentContractTestRunner.gd
              CardfrontDeploymentCoreFallbackTestRunner.gd
              CardfrontDeploymentDirectionalZoneTestRunner.gd
              CardfrontDeploymentPlayerCommitTestRunner.gd
              CardfrontDeploymentPreviewParityTestRunner.gd
              CardfrontDeploymentAiParityTestRunner.gd
              CardfrontDeploymentAutomaticSpawnTestRunner.gd
              CardfrontDeploymentFourConsumerParityTestRunner.gd
              CardfrontHeroNumericFoundationTestRunner.gd
              CardfrontCardPoolRebalanceTestRunner.gd
              CardfrontTerritoryDefenseTestRunner.gd
              CardfrontEngineerContactFrontTestRunner.gd
              CardfrontVerticalSliceFeedbackTestRunner.gd
              CardfrontLiveRuntimeBoundaryTestRunner.gd
          - batch: Stronghold and gate audits
            scripts: |
              CardfrontStrongholdSystemTestRunner.gd
              CardfrontStrongholdTimeoutScoringTestRunner.gd
              CardfrontGateConnectivityTestRunner.gd
              CardfrontGateRuntimeTestRunner.gd
          - batch: Historical balance audit
            scripts: |
              CardfrontHeroBalanceSimulationTestRunner.gd
          - batch: Parity balance audit
            scripts: |
              CardfrontParityBalanceAuditTestRunner.gd
          - batch: Live AI offers and formal assets
            scripts: |
              CardfrontSupportCaptureLiveRuntimeTestRunner.gd
              CardfrontAiObservationBoundaryTestRunner.gd
              CardfrontAiObservationProjectionTestRunner.gd
              CardfrontAiCommanderObservationTestRunner.gd
              CardfrontOfferLevelProjectionTestRunner.gd
              CardfrontNoDeckInflationTestRunner.gd
              CardfrontFormalAssetValidatorTestRunner.gd
              CardfrontFormalTowerAssetTestRunner.gd
              CardfrontLaneAllocationTestRunner.gd
    env:
      GODOT_VERSION: 4.7.1-stable
      GODOT_ARCHIVE: Godot_v4.7.1-stable_win64.exe.zip
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot archive
        uses: actions/cache@v4
        with:
          path: .godot-cache
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_ARCHIVE }}

      - name: Download Godot
        id: godot
        shell: pwsh
        run: |
          $cacheDir = Join-Path "${{ github.workspace }}" ".godot-cache"
          New-Item -ItemType Directory -Path $cacheDir -Force | Out-Null
          $archiveUrl = "https://github.com/godotengine/godot/releases/download/$env:GODOT_VERSION/$env:GODOT_ARCHIVE"
          $archivePath = Join-Path $cacheDir $env:GODOT_ARCHIVE
          $extractPath = Join-Path $env:RUNNER_TEMP "godot"

          if (-not (Test-Path $archivePath)) {
            Invoke-WebRequest -Uri $archiveUrl -OutFile $archivePath
          }
          Expand-Archive -Path $archivePath -DestinationPath $extractPath -Force

          $godotExe = Get-ChildItem -Path $extractPath -Recurse -Filter "*console.exe" | Select-Object -First 1
          if (-not $godotExe) {
            $godotExe = Get-ChildItem -Path $extractPath -Recurse -Filter "*.exe" | Select-Object -First 1
          }
          if (-not $godotExe) {
            throw "Godot executable not found after extraction."
          }

          "path=$($godotExe.FullName)" >> $env:GITHUB_OUTPUT

      - name: Import Project
        shell: pwsh
        run: |
          & "${{ steps.godot.outputs.path }}" --headless --editor --audio-driver Dummy --path "${{ github.workspace }}" --quit
          exit $LASTEXITCODE

      - name: Run ${{ matrix.batch }}
        shell: pwsh
        run: |
          $scripts = "${{ matrix.scripts }}" -split "`n" | ForEach-Object { $_.Trim() } | Where-Object { $_ }
          if ($scripts.Count -eq 0) {
            throw "Headless test batch resolved to zero scripts."
          }
          $artifactDir = Join-Path "${{ github.workspace }}" "artifacts\headless\${{ strategy.job-index }}"
          New-Item -ItemType Directory -Path $artifactDir -Force | Out-Null

          $failures = @()
          foreach ($script in $scripts) {
            Write-Host "Running $script"
            $logPath = Join-Path $artifactDir ($script + ".log")
            & "${{ steps.godot.outputs.path }}" --headless --audio-driver Dummy --path "${{ github.workspace }}" --script "res://scripts/tests/$script" 2>&1 | Tee-Object -FilePath $logPath
            $exitCode = $LASTEXITCODE
            if ($exitCode -ne 0) {
              $failures += "$script ($exitCode)"
            }
          }

          if ($failures.Count -gt 0) {
            throw "Headless failures: $($failures -join ', ')"
          }

      - name: Upload headless script logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: headless-${{ strategy.job-index }}-${{ github.run_id }}
          path: artifacts/headless/**/*.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload parity balance audit
        if: always() && matrix.batch == 'Parity balance audit'
        uses: actions/upload-artifact@v4
        with:
          name: cardfront-parity-audit-${{ github.run_id }}
          path: artifacts/cardfront-parity-audit.*
          if-no-files-found: error
          retention-days: 14
